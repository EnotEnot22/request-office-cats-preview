name: Publish office cats preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore static site
        run: |
          cat request-cats-site.chunk-* > /tmp/request-cats-site.tar.gz
          echo '0a954eda1f72db0f062377ebd9fadb39fdb6eacab5225f44d1adc4c1f422256b  /tmp/request-cats-site.tar.gz' | sha256sum -c -
          mkdir -p public
          tar -xzf /tmp/request-cats-site.tar.gz -C public
          touch public/.nojekyll
          test -f public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
